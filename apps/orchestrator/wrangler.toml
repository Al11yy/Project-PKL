# Cloudflare Worker configuration for the orchestrator.
#
# The Worker replaces the Express server that used to run on :5181. `src/worker.ts` is the
# entry point; `src/server.ts` still exists for the Node dev path (see `npm run dev`), and
# both mount the same Hono app from `src/app.ts` so the two cannot drift.
#
# Secrets are never written here. `LLM_KITA_API_KEY` is set with
#   wrangler secret put LLM_KITA_API_KEY        (deployed)
#   .dev.vars                                    (local, gitignored)

name = "rakit-orchestrator"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# `nodejs_compat` is deliberately NOT enabled. The three Node dependencies the old code had
# (`node:crypto` for ids, `process.env` for config, `unref()` on timers) were removed rather
# than polyfilled: `crypto.randomUUID()`, `crypto.subtle`, and bindings are available natively,
# and a polyfill would hide the next Node-only API someone reaches for.

[observability]
enabled = true

# D1 binding. The `database_id` is a public identifier, not a secret — it names the database,
# it does not grant access to it. Access comes from the Worker's own binding.
#
# This database holds *platform* metadata: the projects the editor lists and their revisions.
# It is NOT the per-user-project database described in the PRD — those are separate D1
# instances provisioned later, one per published app.
[[d1_databases]]
binding = "DB"
database_name = "rakit-db"
database_id = "0a8f0b2e-1949-4388-9c8b-3567a3f33120"

# Non-secret configuration. Secrets go in `wrangler secret`, never here.
[vars]
LLM_KITA_BASE_URL = "https://llm-kita.com"
LLM_KITA_MODEL = "kita-default"
LLM_TIMEOUT_MS = "60000"
LLM_MAX_TOKENS_GENERATE = "8000"
LLM_MAX_TOKENS_REVISE = "12000"
